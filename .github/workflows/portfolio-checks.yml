name: Portfolio and M4 checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check app.js
      - run: node --check i18n.js
      - run: python -m json.tool bank-data.json > /dev/null
      - run: python -m pip install pandas scikit-learn pytest
      - run: python -m pytest projects/healthpredict/tests -q -o pythonpath=projects/healthpredict
